# Pilot and time-to-learn configuration (brief 1 section 5). Committed before the first scored run; never tuned after
# seeing scores (brief 1 refusal list). Every value here is the brief's stated default or a criterion it states.

[pilot]
# The incumbent's pilot on the measurement host: this many episodes or this much wall-clock, whichever binds first.
# Reaching the cap before the episodes complete is a stop-and-report boundary, not a smaller pilot.
world = "crafter"
episodes = 200
cap_s = 7200

[time_to_learn]
# Assumed shifts of a candidate over the incumbent, in achievements per episode (section 5), and the posterior mass on
# the correct sign of the difference in mean utility that makes a shift detected.
deltas = [0.25, 0.5, 1.0]
mass = 0.9
# Pre-stated criteria: FIT if fit_delta is detectable within budget_s of compute on the host, MARGINAL if only
# marginal_delta is, UNFIT otherwise. budget_s is one day.
fit_delta = 0.5
marginal_delta = 1.0
budget_s = 86400
# Monte Carlo sizes of the analysis: simulated experiments per sample size, and Bayesian-bootstrap draws of each
# experiment's posterior. seed starts the analysis's own random stream; it is never a World seed.
experiments = 1000
posterior_draws = 1000
seed = 0

[requests]
# The pilot asks evaluate() for its episodes in requests of this many; the cap is checked before each request, so an
# episode under way when the cap passes is finished and recorded, never cut. A request plays its episodes in one
# container while none fails, so each request pays one container start: ten episodes amortise it as an evaluating
# caller would, and keep the cap's resolution at ten episodes. Not a score: no utility passes through it.
episodes = 10

[incumbent]
# The random incumbent's image (brief 1 section 4) and the party that proposed it: the `Proposer:` trailer of
# 0f698c4, the commit that added incumbents/random. The pilot issues this party a credential and registers the image
# under it, so the judge stamps every pilot record with it (A4 item 2); the report's proposer is read off the records.
context = "incumbents/random"
proposer = { kind = "builder", model = "claude-opus-5-5", session = "95480223-ce68-40b9-8786-3b70a9bdb7da" }
