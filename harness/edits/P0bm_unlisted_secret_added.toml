# P0bm's mutant `unlisted_secret_added` (brief 2, audit 8aae43c8c792 finding 4): the build workflow is handed a
# repository secret the trusted-base list does not name, so the base grows outside every loop and unrecorded.
[[edit]]
path = ".github/workflows/build.yml"
old = "      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}\n"
new = "      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}\n      EXTRA_TOKEN: ${{ secrets.ASSIZE_EXTRA_TOKEN }}\n"
