# P0ao's mutant (instruction #113 Part D): build.yml starts on a label through `pull_request` again, so a pull request's own
# copy of the file decides how it is built.
[[edit]]
path = ".github/workflows/build.yml"
old = """  pull_request_target:
    types: [labeled]
  issues:"""
new = """  pull_request:
    types: [labeled]
  issues:"""
