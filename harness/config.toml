# Harness configuration. Committed before the first scored run; never tuned after seeing results.
[harness]
# Wall-clock limit, in seconds, for one child check process. Exceeding it records the run as a timeout.
child_timeout_s = 120
# After a child exits or is killed, how long, in seconds, the parent waits for its remaining descendants to die on
# their own before killing them (each counted in leaked_processes), and then for every process holding the run's
# scratch root to die before deleting the root regardless (the run then records scratch_quiescent=false).
reap_grace_s = 5
# Polling interval, in seconds, for every bounded wait (scratch quiescence, process exit).
poll_step_s = 0.05
# Worker processes a full run spreads its pins across, each running one task (a clean run, or a mutant and its twin)
# at a time (brief 2, Wish #134 scope 1). 1 is the serial orchestrator, unchanged. A larger N is adopted only when it
# beats N=1 on the switch rule (brief 2 A3 section 5), measured on the self-hosted `pins` runner; it is not set by sight.
workers = 1
