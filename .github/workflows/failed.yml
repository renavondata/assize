name: failed
on:
  workflow_run:
    workflows: [build, review]
    types: [completed]
permissions:
  issues: write
jobs:
  report:
    if: contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" = cancelled ]; then
            started=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '[.jobs[].steps[]? | select(.started_at != null and .conclusion != "skipped")] | length' \
              | awk '{n += $1} END {print n + 0}')
            [ "$started" -eq 0 ] && exit 0
          fi
          title="$WF run $RUN_ID $CONCLUSION on $BRANCH"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          [ -n "$existing" ] && exit 0
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --assignee gfrmin \
            --body "$(printf 'The %s session died: %s.\n\n%s\n' "$WF" "$CONCLUSION" "$URL")"
