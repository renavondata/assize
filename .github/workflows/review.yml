name: review
# Instruction #54 item 8: /review, /audit and /vizier are procedures of the reviewer account, chosen from the event.
on:
  pull_request:
    types: [labeled]
  push:
    branches: [master]
    paths: [REPORT.md]
  issues:
    types: [labeled, assigned]
  schedule:
    - cron: '0 5 * * *'        # daily
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr || github.event.issue.number || github.event_name }}
  cancel-in-progress: false
# Instruction #65: a review session's own label changes never start a review. They are recognised by the label: a session
# only removes `needs-review` and adds `blocked` or `awaits-guy` (.claude/commands/review.md), so a `needs-review` label
# applied by assize-reviewer (an audit-findings PR, the Vizier sending a changed head back) is not its own and starts one.
jobs:
  review:
    if: >-
      (github.event.sender.login != 'assize-reviewer' ||
        (github.event_name == 'pull_request' && github.event.label.name == 'needs-review')) && (
        github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' && contains(fromJSON('["needs-review","awaits-guy"]'), github.event.label.name)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && contains(fromJSON('["failed-run","wish"]'), github.event.label.name)) ||
        (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'gfrmin'))
    runs-on: [self-hosted, agent]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.ASSIZE_REVIEWER_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      VIZIER_EVENT: ${{ github.event_name }}
      VIZIER_ACTION: ${{ github.event.action }}
      VIZIER_LABEL: ${{ github.event.label.name }}
      VIZIER_ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: master, fetch-depth: 0, persist-credentials: false }
      - run: gh auth setup-git
      # Instruction #110 Part C: a push of a commit whose trailers git does not parse is refused. The path is relative,
      # so the hook is the one on the branch checked out when the session pushes, the code under test.
      - run: git config core.hooksPath harness/hooks
      - id: choose
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          case "$EVENT:$LABEL" in
            workflow_dispatch:*|pull_request:needs-review) run="review /review $PR" ;;
            push:*|issues:failed-run) run="vizier /vizier;audit /audit" ;;
            *) run="vizier /vizier" ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # Instruction #54 item 7: each procedure's model is elected by EXP3 over harness/entrants.toml, never named here
      # (instruction #64). Each draw is read from and committed onto origin's ledger/draws branch.
      - env:
          RUN: ${{ steps.choose.outputs.run }}
        run: |
          set -euo pipefail
          IFS=';' read -ra procs <<< "$RUN"
          for p in "${procs[@]}"; do
            proc=${p%% *}; cmd=${p#* }
            model=$(uv run --frozen python -m harness.ledger elect "$proc" --seed ${{ github.run_id }} --head origin/master --publish origin)
            echo "$proc: elected $model" | tee -a review.log
            git checkout -q master
            claude --model "$model" -p "$cmd" --max-turns 250 --output-format stream-json --verbose >> review.log 2>&1
          done
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: review-${{ github.run_id }}
          path: review.log
          retention-days: 14
