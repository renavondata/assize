name: build
on:
  push:
    branches: [master]
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build on; empty builds master", required: false, type: string }
jobs:
  build:
    if: (github.event_name != 'pull_request' && github.event_name != 'issues') || (github.event_name == 'pull_request' && github.event.label.name == 'blocked') || (github.event_name == 'pull_request' && github.event.label.name == 'awaits-guy') || (github.event_name == 'issues' && github.event.label.name == 'instruction')
    # Instruction #102: an `awaits-guy` label on a pull request starts a Builder on master, not on the PR branch (the PR
    # is finished from the Builder's side), so the queue does not pause while Guy's answer is pending; it queues in
    # master's group and checks out no PR. The `blocked` path is unchanged: it builds on the PR, in the PR's group.
    # Instruction #110 Part A: one queue per branch. Only a job that passes `if:` enters its group, so a skipped
    # `issues: labeled` event never replaces a pending run, and a pull request's Builder never waits behind master's.
    concurrency:
      group: build-${{ (github.event.label.name != 'awaits-guy' && github.event.pull_request.number) || inputs.pr || 'master' }}
      cancel-in-progress: false
    runs-on: [self-hosted, agent]
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.ASSIZE_BUILDER_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ASSIZE_ACK: ${{ github.event_name == 'workflow_dispatch' && 'yes' || 'no' }}
      ASSIZE_PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: master, fetch-depth: 0, persist-credentials: false }
      - run: gh auth setup-git
      - if: (github.event_name == 'pull_request' && github.event.label.name == 'blocked') || inputs.pr != ''
        run: gh pr checkout ${{ github.event.pull_request.number || inputs.pr }}
      # Instruction #110 Part C: a push of a commit whose trailers git does not parse is refused. The path is relative,
      # so the hook is the checked-out branch's own, the code under test.
      - run: git config core.hooksPath harness/hooks
      # Instruction #54 item 7: the model is elected by EXP3 over harness/entrants.toml, never named here (instruction
      # #64). The draw is read from and committed onto origin's ledger/draws branch, so the next election reads it.
      - run: |
          model=$(uv run --frozen python -m harness.ledger elect build --seed ${{ github.run_id }} --head origin/master --publish origin)
          echo "elected: $model"
          claude --model "$model" -p "/build" --max-turns 250 --output-format stream-json --verbose > build.log 2>&1
      # Instruction #112 Part A item 5: this step fails when the session ended with usage_limit_reached; the price counts
      # sessions lost to the limit by this step's name (harness.ledger.LIMIT_STEP), read through the Actions API.
      - if: always()
        name: usage limit
        run: uv run --frozen python -m harness.sessions limit build.log
      - if: always()
        name: redact
        run: python3 -c 'import functools, os, pathlib; p = pathlib.Path("build.log"); vs = [v.encode() for v in map(os.environ.get, ("GH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN")) if v]; p.exists() and p.write_bytes(functools.reduce(lambda b, v:b.replace(v, b"[redacted]"), vs, p.read_bytes()))'
      - if: always()
        name: secrets
        run: uv run --frozen python -m harness.sessions secrets build.log || { rm -f build.log; exit 1; }
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ github.run_id }}
          path: build.log
          retention-days: 14
