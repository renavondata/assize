name: measure

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure'
    runs-on: [self-hosted, measure]
    timeout-minutes: 60
    env:
      ASSIZE_HOST: measure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require uv on the host
        run: command -v uv && uv --version
      - name: Sync environment
        run: uv sync --frozen
      - name: make measure (host facts, then make pins)
        run: make measure HOST_OUT=out/host
      - name: Upload host facts and pins report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measure-host
          path: out/host
          if-no-files-found: error
