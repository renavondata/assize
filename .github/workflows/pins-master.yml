name: pins-master

# Instruction #176: the judge never comes from the accused. A pull request's own `pins` run uses the pull request's own
# harness/ and pins.yml, so a pull request can weaken the check that judges it. This run checks out the pull request's
# head, restores harness/, Makefile, pyproject.toml and uv.lock from master over it, and runs the full `make pins`. It
# runs on pull_request_target so that the workflow itself is master's, and it holds no write scope and no secret: the
# head's code runs here, so the token is the read-only one the pins need to read issues, pull requests and runs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: pins-master-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pins-master:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        run: pipx install uv==0.8.17
      # Every file of the head's harness/ goes, except the proposer rows (data each pull request writes for itself,
      # harness/proposer.d/); then master's harness/, Makefile, pyproject.toml and uv.lock are checked out over the tree.
      - name: Restore the judge from master
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git ls-files -z -- harness ':(exclude)harness/proposer.d' | xargs -0 -r rm -f
          git checkout origin/master -- harness Makefile pyproject.toml uv.lock
      - name: Sync environment
        run: uv sync --frozen
      - name: Pins are monotone
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m harness.claims pins-monotone "$(git merge-base origin/master HEAD)" HEAD
      - name: make pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: make pins PINS_OUT=out/pins
      - name: Upload pins report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pins-master-report
          path: out/pins
          if-no-files-found: error
