name: release

# Instruction #342 item 3a: the judge's sealed image (harness/seal.py) is composed from judge/ and the pinned base,
# its manifest digest must equal release/seal.toml's, and only then is it pushed to ghcr.io by digest and pulled back.
# The workflow's own file is in the paths so that a change to it is witnessed by a run of it.
on:
  push:
    paths:
      - "release/**"
      - "judge/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/renavondata/assize-judge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv==0.8.17
      - name: Sync environment
        run: uv sync --frozen
      - name: Compose the image
        run: |
          mkdir -p out
          uv run --frozen python -m harness.seal out/oci | tee out/seal.txt
      - name: Composed digest equals the seal
        id: seal
        run: |
          sealed=$(python3 -c 'import tomllib; print(tomllib.load(open("release/seal.toml", "rb"))["digest"])')
          composed=$(sed -n 's/^manifest //p' out/seal.txt)
          echo "sealed $sealed composed $composed"
          [ -n "$sealed" ] && [ "$composed" = "$sealed" ] || { echo "the composed digest is not the seal" >&2; exit 1; }
          echo "digest=$sealed" >> "$GITHUB_OUTPUT"
      - name: Push by digest
        env:
          DIGEST: ${{ steps.seal.outputs.digest }}
          CREDS: ${{ github.actor }}:${{ github.token }}
        run: skopeo copy --preserve-digests --dest-creds "$CREDS" "oci:out/oci" "docker://$IMAGE@$DIGEST"
      - name: Pulled digest equals the seal
        env:
          DIGEST: ${{ steps.seal.outputs.digest }}
          CREDS: ${{ github.actor }}:${{ github.token }}
        run: |
          pulled=$(skopeo inspect --format '{{.Digest}}' --creds "$CREDS" "docker://$IMAGE@$DIGEST")
          echo "pulled $pulled sealed $DIGEST"
          [ "$pulled" = "$DIGEST" ] || { echo "the pulled digest is not the seal" >&2; exit 1; }
          echo "released $IMAGE@$pulled" >> "$GITHUB_STEP_SUMMARY"
