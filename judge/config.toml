# Judge configuration (brief 1 section 2). Committed before the first scored run; never tuned after seeing scores.

[candidate]
# Base image of every candidate container: python:3.11-slim, pinned by its multi-platform index digest.
base_image = "docker.io/library/python@sha256:0dd364ba7e10242f07755449e3a3d0e35f9efd987952737b90def6709ab0c5ce"
# cgroup limits of one candidate container: CPUs (cpu.max quota over period), memory in MiB (swap equal to it, so
# none), and the process count. One CPU is the share a candidate gets on the 12-thread host with room for the judge.
cpus = 1.0
memory_mib = 1024
pids = 64

[timeouts]
# Wall-clock limits on the candidate, in seconds (brief 1 section 2). step_s bounds each reply, begin_episode and
# end_episode included, from the moment its request is sent, so the first reply also covers the container's start.
# episode_s bounds a whole episode: a Crafter episode is at most 10000 steps, and the 2-hour pilot cap over 200
# episodes allows 36 s each on average; 600 s lets a slow candidate finish while bounding a stalled one.
step_s = 10.0
episode_s = 600.0
# How long the judge waits for the runtime to force-remove a container, and then for its client process to exit.
teardown_s = 30.0
# The longest reply line the judge reads; a longer one is invalid_reply. A step reply is an action and at most one
# probability list per target, a few kilobytes; 1 MiB bounds the judge's memory against a candidate that never ends a line.
reply_bytes = 1048576

[price.crafter]
# The exchange rate of compute into the World's per-episode utility (brief 1 A4 item 4), in Crafter achievements per
# CPU-second and per gigabyte-second (1e9 bytes) of peak memory. Committed before the first scored run; never tuned after
# a score is seen. Derivation: an episode that exhausts every allowance of [candidate] and [timeouts] (cpus CPUs and
# memory_mib MiB for episode_s seconds) is charged delta = 0.5 achievements, half for each resource. 0.5 is the
# smallest effect brief 1's FIT criterion requires the court to detect: priced lower, a candidate's whole allowance
# would cost less than any difference the court resolves, and compute would be free in every adoption decision;
# priced higher, compute would outweigh utility differences the court does resolve. So:
#   cpu_s       = (delta / 2) / (cpus * episode_s)                     = 0.25 / 600
#   memory_gb_s = (delta / 2) / (memory_mib * 2**20 / 1e9 * episode_s) = 0.25 / (1.073741824 * 600)
# The pricing rule is `judge/price.py`'s: what the judge could not measure is charged at the configured limit.
cpu_s = 0.0004166666666666667
memory_gb_s = 0.00038805107275644935

[calibration]
# Bins of predicted probability in each target's reliability table (brief 1 A4 item 3): `bins` equal bins of [0, 1].
# Committed before the first scored run; never tuned after a score is seen. The table is a report, not a decision: no
# adoption or verdict reads it. Each bin records its count, its hits and the sum of its probabilities, so its mean
# predicted probability is exact whatever the width, and tables add across episodes; the width sets only how finely
# predicted probability is resolved. Ten bins of width 0.1 are the conventional reliability diagram (Niculescu-Mizil and
# Caruana 2005).
bins = 10
